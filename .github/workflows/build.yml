name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build KFLauncher/KFLauncher.csproj -c Release
      - run: dotnet run --project KFLauncher/KFLauncher.csproj -- --selftest

  # tag a commit (git tag v1.2.3 && git push --tags) and the binaries turn up under releases
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # self contained, so nobody has to install a runtime first.  windows cross builds fine here
      - name: Publish
        run: |
          publish() {
            dotnet publish KFLauncher/KFLauncher.csproj -c Release -r "$1" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true -o "out/$1"
          }
          publish win-x64
          publish linux-x64
          mv out/win-x64/KFLauncher.exe KFLauncher-windows-x64.exe
          mv out/linux-x64/KFLauncher KFLauncher-linux-x64
          chmod +x KFLauncher-linux-x64

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes KFLauncher-windows-x64.exe KFLauncher-linux-x64
